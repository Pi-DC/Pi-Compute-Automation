---
# Collections for the older Ansible (ansible-core 2.16, /opt/ansible-el7 on pi-jenkins-agent) that manages
# clients whose own Python is older than 3.9 (EL7, EL8, Ubuntu 20.04): see scripts/run-playbook.sh.
# These are the last versions that still run on ansible-core 2.16. Installed into ./collections-el7 by
# scripts/run-playbook.sh. Upgrade deliberately, through a PR.
collections:
  - name: community.general
    version: "10.7.5"
  - name: ansible.posix
    version: "1.6.2"
  - name: ansible.windows
    version: "2.8.0"
  - name: community.windows
    version: "2.4.0"
