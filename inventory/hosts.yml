---
# Every client VM is listed here with its IP and os_baseline.
# os_baseline must name a file in baselines/ (Ubuntu-22, Ubuntu-24, RedHat-9, Windows-2019, Windows-2022).
# Each host listed here also needs host_vars/<hostname>.yml.
#
# Example (uncomment and edit when you add your first client):
#   linux:
#     hosts:
#       client01: {ansible_host: 172.20.119.111, os_baseline: Ubuntu-24}
#   windows:
#     hosts:
#       client03: {ansible_host: 172.20.119.113, os_baseline: Windows-2022}
all:
  children:
    linux:
      hosts: {}
    windows:
      hosts: {}
