---
# Every client VM is listed here with its IP and os_baseline.
# os_baseline must name a file in baselines/: <Distribution>-<major version> as Ansible reports it, e.g.
# Ubuntu-24, RedHat-9, Rocky-9, AlmaLinux-8, OracleLinux-8, CentOS-7, Windows-2022 (see baselines/ for all).
# Each host listed here also needs host_vars/<hostname>.yml.
#
# Example (uncomment and edit when you add your first client):
#   linux:
#     hosts:
#       client01: {ansible_host: 172.20.119.111, os_baseline: Ubuntu-24}
#   windows:
#     hosts:
#       client03: {ansible_host: 172.20.119.113, os_baseline: Windows-2022}
all:
  children:
    linux:
      hosts:
        zabbix-ssl:
          ansible_host: 172.20.119.51
          os_baseline: CentOS-7
          fw_cred_id: client-zabbix-ssl
          ansible_user: '{{ lookup("env", "FWCRED_ZABBIX_SSL_USER") }}'
          ansible_password: '{{ lookup("env", "FWCRED_ZABBIX_SSL_PASS") }}'
          ansible_port: 59222
          fw_ssh_port: 59222
          ansible_become_password: '{{ lookup("env", "FWCRED_ZABBIX_SSL_PASS") }}'
    windows:
      hosts: {}
