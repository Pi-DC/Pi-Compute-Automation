---
# Order: adds -> remove retired management rules -> enable + inbound block -> removes
# No rule is added by default: only this host's plan (scripts/access_check.py keeps Ansible's access).
# Every rule Ansible creates is named ANS-..., so removals never touch built-in or manual rules.
- name: Add rules
  community.windows.win_firewall_rule:
    name: "{{ fw_windows_rule_name }}"
    description: "{{ item.comment }}"
    localport: "{{ item.port }}"
    protocol: "{{ item.proto }}"
    remoteip: "{{ item.src }}"
    localip: "{{ item.dst | default('any') }}"
    direction: in
    action: allow
    profiles: [domain, private, public]
    enabled: true
    state: present
  loop: "{{ fw_add | default([]) }}"

# After the adds: the host's own rules keep Ansible's access while these go.
- name: Remove retired management rules
  community.windows.win_firewall_rule:
    name: "{{ item }}"
    state: absent
  loop: "{{ fw_retired_windows_rules | default([]) }}"

- name: Firewall on for all profiles, inbound block
  ansible.windows.win_firewall:
    profiles: [Domain, Private, Public]
    state: enabled
    inbound_action: block
    outbound_action: allow

- name: Remove rules
  community.windows.win_firewall_rule:
    name: "{{ fw_windows_rule_name }}"
    state: absent
  loop: "{{ fw_remove | default([]) }}"
