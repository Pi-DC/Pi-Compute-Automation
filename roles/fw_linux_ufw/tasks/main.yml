---
# Order: adds -> remove retired management rules -> default policy + enable -> removes
# No rule is added by default: only this host's plan (scripts/access_check.py keeps Ansible's access).
- name: Add rules
  community.general.ufw:
    rule: allow
    proto: "{{ item.proto }}"
    port: "{{ item.port | string | replace('-', ':') }}"
    from_ip: "{{ item.src }}"
    to_ip: "{{ item.dst | default('any') }}"
    comment: "managed-by-ansible: {{ item.comment }}"
  loop: "{{ fw_add | default([]) }}"

# After the adds: the host's own rules keep Ansible's access while these go.
- name: Remove retired management SSH rules
  community.general.ufw:
    rule: allow
    proto: tcp
    port: "{{ fw_ssh_port | default(22) | string }}"
    from_ip: "{{ item }}"
    delete: true
  loop: "{{ fw_retired_ssh_sources | default([]) }}"

- name: Default policies
  community.general.ufw:
    direction: "{{ item.d }}"
    policy: "{{ item.p }}"
  loop:
    - { d: incoming, p: deny }
    - { d: outgoing, p: allow }

- name: Enable UFW
  community.general.ufw:
    state: enabled
    logging: "low"

- name: Remove rules
  community.general.ufw:
    rule: allow
    proto: "{{ item.proto }}"
    port: "{{ item.port | string | replace('-', ':') }}"
    from_ip: "{{ item.src }}"
    to_ip: "{{ item.dst | default('any') }}"
    delete: true
  loop: "{{ fw_remove | default([]) }}"
