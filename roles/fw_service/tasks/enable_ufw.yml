---
# UFW keeps its rules while disabled and denies incoming once enabled: add this host's rules first
# (they include Ansible's access, scripts/access_check.py). Same rules as fw_linux_ufw "Add rules".
- name: This host's rules, before UFW is switched on
  community.general.ufw:
    rule: allow
    proto: "{{ item.proto }}"
    port: "{{ item.port | string | replace('-', ':') }}"
    from_ip: "{{ item.src }}"
    to_ip: "{{ item.dst | default('any') }}"
    comment: "managed-by-ansible: {{ item.comment }}"
  loop: "{{ fw_host_rules }}"

- name: Switch UFW on
  community.general.ufw:
    state: enabled

- name: UFW starts at boot
  ansible.builtin.systemd:
    name: ufw
    enabled: true
    state: started
