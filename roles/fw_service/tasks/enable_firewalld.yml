---
# firewalld starts with its saved (permanent) rules. Save this host's rules first, with the daemon
# stopped, so it starts with exactly them (they include Ansible's access, scripts/access_check.py).
# The default zone's own "ssh" service is closed afterwards by fw_linux_firewalld.
- name: This host's rules in the saved configuration, before firewalld starts
  ansible.builtin.shell: |
    rule='{{ fw_firewalld_rich_rule }}'
    firewall-offline-cmd --query-rich-rule="$rule" >/dev/null && exit 0
    firewall-offline-cmd --add-rich-rule="$rule" && echo ADDED
  register: fw_service_offline_rule
  changed_when: "'ADDED' in fw_service_offline_rule.stdout"
  loop: "{{ fw_host_rules }}"
  when: not fw_service_state.running

- name: Unmask, enable at boot and start firewalld
  ansible.builtin.systemd:
    name: firewalld
    masked: false
    enabled: true
    state: started
