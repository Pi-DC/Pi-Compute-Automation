---
- name: Windows Firewall service starts automatically and runs
  ansible.windows.win_service:
    name: MpsSvc
    start_mode: auto
    state: started

# This host's rules first (they include Ansible's WinRM access, scripts/access_check.py), so switching the
# profiles on cannot cut Ansible off. Same rules as fw_windows "Add rules".
- name: This host's rules, before the firewall is switched on
  community.windows.win_firewall_rule:
    name: "{{ fw_windows_rule_name }}"
    description: "{{ item.comment }}"
    localport: "{{ item.port }}"
    protocol: "{{ item.proto }}"
    remoteip: "{{ item.src }}"
    localip: "{{ item.dst | default('any') }}"
    direction: in
    action: allow
    profiles: [domain, private, public]
    enabled: true
    state: present
  loop: "{{ fw_host_rules }}"

- name: Switch the firewall on for all profiles
  ansible.windows.win_firewall:
    profiles: [Domain, Private, Public]
    state: enabled
