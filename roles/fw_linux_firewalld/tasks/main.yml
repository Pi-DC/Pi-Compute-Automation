---
# Order: adds -> remove retired management rules -> close default open services -> removes
# No rule is added by default: only this host's plan (scripts/access_check.py keeps Ansible's access).
- name: Ensure firewalld is running
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true
  register: fw_linux_firewalld_start

# firewalld 0.6+ (CentOS 7, RHEL 8) warns "AllowZoneDrifting is enabled. This is considered an insecure
# configuration option". No rule here uses source-based zones, so turning it off changes no rule.
# Only an existing line is changed: newer firewalld (RHEL 9) has no such option, and nothing is added there.
- name: AllowZoneDrifting off
  ansible.builtin.lineinfile:
    path: "{{ fw_linux_firewalld_conf }}"
    regexp: '^AllowZoneDrifting=(?!no$)'
    line: AllowZoneDrifting=no
    backrefs: true
  notify: Reload firewalld

# A dry run (--check) cannot start firewalld, and firewalld cannot preview rules while it is stopped.
- name: Firewall is off, so the dry run cannot show the rule changes
  ansible.builtin.debug:
    msg: >-
      firewalld is not running on {{ inventory_hostname }}. Enabling the firewall starts it with this host's
      rules; then {{ fw_add | default([]) | length }} add /
      {{ fw_remove | default([]) | length }} remove rule(s) from plans/{{ inventory_hostname }}.yml are applied.
  when: ansible_check_mode and fw_linux_firewalld_start is changed

- name: Rules
  when: not (ansible_check_mode and fw_linux_firewalld_start is changed)
  block:
    - name: Add rules
      ansible.posix.firewalld:
        rich_rule: "{{ fw_firewalld_rich_rule }}"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ fw_add | default([]) }}"

    # After the adds: the host's own rules keep Ansible's access while these go.
    - name: Remove retired management SSH rules
      ansible.posix.firewalld:
        rich_rule: 'rule family="ipv4" source address="{{ item }}" port port="{{ fw_ssh_port | default(22) }}" protocol="tcp" accept'
        permanent: true
        immediate: true
        state: disabled
      loop: "{{ fw_retired_ssh_sources | default([]) }}"

    # Not every firewalld knows every service (CentOS 7 has no cockpit), and an unknown one is an error.
    - name: Read the services this firewalld knows
      ansible.builtin.command: firewall-cmd --get-services
      register: fw_linux_firewalld_services
      changed_when: false
      check_mode: false

    - name: Close services the default zone opens to everyone
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        immediate: true
        state: disabled
      loop: "{{ ['ssh', 'cockpit'] | intersect(fw_linux_firewalld_services.stdout.split()) }}"

    - name: Remove rules
      ansible.posix.firewalld:
        rich_rule: "{{ fw_firewalld_rich_rule }}"
        permanent: true
        immediate: true
        state: disabled
      loop: "{{ fw_remove | default([]) }}"
